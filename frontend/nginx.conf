server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 必須與後端的 MAX_UPLOAD_MB 一致。nginx 預設僅 1MB，
    # 未設定時任何超過 1MB 的 PDF 都會在到達後端之前就被擋下，
    # 使用者看到的是 nginx 的 413 而非後端的訊息。
    client_max_body_size 30m;

    # 後端擁有的路徑必須明確代理。單頁應用的 try_files 會把未匹配的路徑
    # 一律回退到 index.html 並回傳 200 —— 對 /health 而言這是靜默失敗：
    # 後端就算掛掉，監控看到的仍是 200，只是內容變成 HTML。
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 必須關閉緩衝，否則串流會被整批送出，逐字顯示的效果會消失
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}
